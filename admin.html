<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RISING 管理画面</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#111318;color:#f7f4ea;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif} header{position:sticky;top:0;z-index:5;background:#171a21;border-bottom:1px solid #303641;padding:14px 20px;display:flex;gap:12px;align-items:center;justify-content:space-between} h1{font-size:20px;margin:0} main{padding:20px;display:grid;gap:18px}.panel{background:#1b1f28;border:1px solid #313846;border-radius:8px;padding:16px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.field{display:grid;gap:6px;min-width:150px}.field input,.field select,.settingMini{height:38px;border-radius:6px;border:1px solid #3d4656;background:#0f1218;color:#fff;padding:0 10px}button{height:38px;border:0;border-radius:6px;padding:0 13px;font-weight:800;cursor:pointer;background:#f0c85a;color:#1b1300}.ghost{background:#293140;color:#f3f7ff}.danger{background:#d54a4a;color:#fff}.muted{color:#9aa4b5;font-size:13px}.machines{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.machine{background:#151922;border:1px solid #2d3440;border-radius:8px;padding:12px;display:grid;gap:9px}.machine h3{margin:0;font-size:18px;display:flex;justify-content:space-between}.pill{font-size:12px;border-radius:999px;padding:3px 8px;background:#303848}.pill.on{background:#1f7a48}.pill.lock{background:#8a5422}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.adminSlumpGraph{width:100%;height:150px;background:#0b0e14;border:1px solid #2b3342;border-radius:6px}.graphStats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.debugBox{border-top:1px solid #2d3440;padding-top:9px;display:grid;gap:8px}.debugBtns{display:flex;gap:6px;flex-wrap:wrap}.debugBtns button{height:34px;padding:0 10px}.debugSelect{height:34px;border-radius:6px;border:1px solid #3d4656;background:#0f1218;color:#fff;padding:0 8px}.stat{background:#0f1218;border-radius:6px;padding:8px}.stat span{display:block;color:#97a3b8;font-size:12px}.stat b{font-size:16px}.passwordList,.results{display:grid;gap:7px;max-height:260px;overflow:auto}.item{display:grid;grid-template-columns:110px 1fr 90px 140px;gap:8px;align-items:center;background:#10141c;border:1px solid #2b3340;border-radius:6px;padding:8px}.code{font-size:20px;letter-spacing:.08em;color:#ffe07c;font-weight:1000}.ok{color:#6aff9e}.bad{color:#ff8b8b}body.locked header,body.locked main{display:none}.authGate{min-height:100vh;display:grid;place-items:center;padding:20px;background:#111318}.authPanel{width:min(420px,100%);background:#1b1f28;border:1px solid #313846;border-radius:8px;padding:22px;display:grid;gap:14px}.authPanel h1{font-size:22px}.authPanel input{width:100%;height:44px;border-radius:6px;border:1px solid #3d4656;background:#0f1218;color:#fff;padding:0 12px}.authPanel button{width:100%;height:44px}body:not(.locked) .authGate{display:none}.topActions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button:disabled{opacity:.45;cursor:not-allowed}@media(max-width:980px){.machines{grid-template-columns:1fr}.item{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body class="locked">
<div id="authGate" class="authGate"><form id="authForm" class="authPanel"><h1>RISING 管理画面</h1><p class="muted">管理パスを入力してください。</p><input id="gatePassword" type="password" autocomplete="current-password" placeholder="管理パス"><button type="submit">入室</button><div id="authError" class="bad"></div></form></div>
<header><h1>RISING 管理画面</h1><div class="topActions"><a class="muted" href="/machines.html" target="_blank">台選びページ</a><a class="muted" href="/play.html" target="_blank">プレイ入口</a><button id="logoutBtn" class="ghost">退出</button></div></header>
<main>
  <section class="panel">
    <h2>パスワード発行</h2>
    <div class="row">
      <label class="field"><span>名前</span><input id="playerName" placeholder="お客様名"></label>
      <label class="field"><span>使用台</span><select id="machineSelect"></select></label>
      <button id="issueBtn">発行</button>
      <b id="issueResult" class="code"></b>
    </div>
    <p class="muted">発行したパスワードは一度だけ使えます。お客様は `/play.html` で入力します。</p>
  </section>

  <section class="panel">
    <h2>共同確認用デバッグスロット</h2>
    <div class="row">
      <button onclick="location.href='/jag.html?machine=debug&debug=1'">デバッグ機能ONで開く</button>
      <button class="ghost" onclick="location.href='/jag.html?machine=debug'">通常表示で開く</button>
      <button class="danger" onclick="resetMachine('debug')">確認台リセット</button>
    </div>
    <p class="muted">共同確認専用です。お客様用の台選びページとパスワード発行の対象には出しません。</p>
  </section>

  <section class="panel">
    <h2>6台状況</h2>
    <div id="machines" class="machines"></div>
  </section>

  <section class="panel">
    <h2>発行済みパスワード</h2>
    <div id="passwordList" class="passwordList"></div>
  </section>

  <section class="panel">
    <h2>終了履歴</h2>
    <div id="results" class="results"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let machines = [];
const ADMIN_STORAGE_KEY = 'risingAdminPassword';
let adminSecret = sessionStorage.getItem(ADMIN_STORAGE_KEY) || '';
function adminHeaders(){ return adminSecret ? {'X-Admin-Password':adminSecret} : {}; }
function fmt(n){ return Number(n || 0).toLocaleString('ja-JP'); }
function signed(n){ n = Number(n || 0); return (n >= 0 ? '+' : '') + fmt(n); }
function isDebugMachine(machine){ return String(machine.machineId) === "debug"; }
function machineLabel(machine){ return isDebugMachine(machine) ? "確認台" : machine.machineId + "号機"; }
function liveMachines(){ return machines.filter(m => !isDebugMachine(m)); }
function debugMachine(){ return machines.find(isDebugMachine) || {machineId:"debug", displayName:"確認台", stats:null, slumpHistory:[{spin:0, profit:0}]}; }
function status(machine){ if(machine.locked) return ['使用中/終了待ち','lock']; if(machine.online) return ['接続中','on']; return ['空き','']; }
function stat(stats, key){ return stats && stats[key] ? stats[key] : 0; }
function historyFor(machine){ return Array.isArray(machine.slumpHistory) && machine.slumpHistory.length ? machine.slumpHistory : [{spin:0, profit:0}]; }
function currentProfit(machine){ const points = historyFor(machine); return Number(points[points.length - 1].profit) || 0; }
function graphBounds(machine){ const profits = historyFor(machine).map(p => Number(p.profit) || 0); return {min:Math.min(0, ...profits), max:Math.max(0, ...profits)}; }
function drawSlump(canvas, points){
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.max(1, Math.floor(rect.width * dpr));
  canvas.height = Math.max(1, Math.floor(rect.height * dpr));
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const w = rect.width, h = rect.height;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle = '#0b0e14';
  ctx.fillRect(0,0,w,h);
  ctx.strokeStyle = '#273044';
  ctx.lineWidth = 1;
  for(let i=1;i<5;i++){ const y = h*i/5; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
  points = Array.isArray(points) && points.length ? points : [{spin:0, profit:0}];
  const profits = points.map(p => Number(p.profit) || 0);
  let min = Math.min(0, ...profits), max = Math.max(0, ...profits);
  if(min === max){ min -= 100; max += 100; }
  const xFor = i => points.length <= 1 ? 0 : i * w / (points.length - 1);
  const yFor = v => h - ((v - min) / (max - min)) * h;
  const zero = yFor(0);
  ctx.strokeStyle = '#6b7280'; ctx.beginPath(); ctx.moveTo(0, zero); ctx.lineTo(w, zero); ctx.stroke();
  ctx.strokeStyle = profits[profits.length - 1] >= 0 ? '#62ff9a' : '#ff5c70';
  ctx.lineWidth = 2;
  ctx.beginPath();
  points.forEach((p,i)=>{ const x = xFor(i), y = yFor(Number(p.profit) || 0); if(i) ctx.lineTo(x,y); else ctx.moveTo(x,y); });
  ctx.stroke();
}
function renderAdminSlumpGraphs(){
  for(const m of machines){
    const c = document.querySelector('canvas[data-machine="' + m.machineId + '"]');
    if(c) drawSlump(c, historyFor(m));
  }
}
function renderMachines(){
  $('machineSelect').innerHTML = liveMachines().map(m => `<option value="${m.machineId}">${machineLabel(m)}</option>`).join('');
  $('machines').innerHTML = liveMachines().map(m => {
    const s = m.stats || {}; const st = status(m);
    return `<article class="machine">
      <h3>${machineLabel(m)} <span class="pill ${st[1]}">${st[0]}</span></h3>
      <div class="muted">${m.currentPlayerName ? '利用者: ' + escapeHtml(m.currentPlayerName) : '利用者なし'} / ${m.lastEndedSession ? '終了データ保持中' : 'リセット済み'}</div>
      <canvas class="adminSlumpGraph" data-machine="${m.machineId}"></canvas>
      <div class="stats">
        <div class="stat"><span>G数</span><b>${fmt(stat(s,'totalSpins'))}</b></div>
        <div class="stat"><span>BB</span><b>${fmt(stat(s,'bigCount'))}</b></div>
        <div class="stat"><span>RB</span><b>${fmt(stat(s,'midCount'))}</b></div>
        <div class="stat"><span>差枚pt</span><b>${signed(s.profit ?? ((s.totalPaid||0)-(s.totalFee||0)))}</b></div>
      </div>
      <div class="graphStats">
        <div class="stat"><span>現在</span><b>${signed(currentProfit(m))}</b></div>
        <div class="stat"><span>最高</span><b>${signed(graphBounds(m).max)}</b></div>
        <div class="stat"><span>最低</span><b>${signed(graphBounds(m).min)}</b></div>
      </div>
      <div class="row">
        <label class="field"><span>設定</span><select class="settingMini" id="setting-${m.machineId}">${[1,2,3,4,5,6].map(n => '<option value="' + n + '" ' + (String((s.setting || m.assignedSetting || 1)) === String(n) ? 'selected' : '') + '>設定' + n + '</option>').join('')}</select></label>
        <button onclick="applySetting('${m.machineId}')">設定反映</button>
        <button class="danger" ${m.currentSessionId || m.lastEndedSession || m.stats ? '' : 'disabled'} onclick="forceEndMachine('${m.machineId}')">強制終了</button>
        <button class="danger" onclick="resetMachine('${m.machineId}')">管理リセット</button>
        <button class="ghost" onclick="location.href='/play.html?machine=${m.machineId}'">入口</button>
      </div>
    </article>`;
  }).join('');
  renderAdminSlumpGraphs();
}
function escapeHtml(v){ return String(v ?? '').replace(/[&<>'"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
async function loadMachines(){ const res = await fetch('/api/machines'); machines = await res.json(); renderMachines(); }
async function loadPasswords(){
  const res = await fetch('/api/admin/passwords', {headers:adminHeaders()});
  if(!res.ok){ $('passwordList').innerHTML = '<div class="bad">管理パスが必要です</div>'; return; }
  const rows = await res.json();
  $('passwordList').innerHTML = rows.map(p => `<div class="item"><b class="code">${p.password}</b><span>${escapeHtml(p.playerName)} / ${p.machineId}号機</span><span>${p.status}</span><span>${new Date(p.issuedAt).toLocaleString('ja-JP')}</span></div>`).join('') || '<div class="muted">まだありません</div>';
}
async function loadResults(){
  const res = await fetch('/api/results', {headers:adminHeaders()});
  if(!res.ok){ $('results').innerHTML = '<div class="bad">管理パスが必要です</div>'; return; }
  const rows = await res.json();
  $('results').innerHTML = rows.map(r => `<div class="item"><b>${r.machineId}号機</b><span>${escapeHtml(r.playerName)} / 請求差枚 ${signed(r.playerProfit ?? r.profit)}pt / ${fmt(r.playerSpins ?? r.totalSpins)}G / BB ${fmt(r.playerBigCount ?? r.bigCount)} / RB ${fmt(r.playerRegCount ?? r.regCount)}</span><span>${r.sheets && r.sheets.ok ? '<span class="ok">Sheets</span>' : '<span class="muted">local</span>'}</span><span>${new Date(r.endedAt).toLocaleString('ja-JP')}</span></div>`).join('') || '<div class="muted">まだありません</div>';
}
async function issue(){
  const body = {playerName:$('playerName').value, machineId:$('machineSelect').value};
  const res = await fetch('/api/admin/issue-password', {method:'POST', headers:{'Content-Type':'application/json', ...adminHeaders()}, body:JSON.stringify(body)});
  const data = await res.json();
  if(!data.ok){ alert(data.error || '発行に失敗しました'); return; }
  $('issueResult').textContent = data.issued.password;
  $('playerName').value = '';
  await loadPasswords();
}
async function applySetting(id){
  const el = document.getElementById('setting-' + id);
  const value = el ? el.value : '1';
  const res = await fetch('/api/admin/machines/' + encodeURIComponent(id) + '/setting', {method:'POST', headers:{'Content-Type':'application/json', ...adminHeaders()}, body:JSON.stringify({setting:value})});
  const data = await res.json();
  if(!data.ok){ alert(data.error || '設定反映に失敗しました'); return; }
  alert(id + '号機を設定' + data.setting + 'にしました' + (data.delivered ? '' : '（台が未接続なので、表示上の設定として保存しました）'));
  await loadMachines();
}
async function forceEndMachine(id){
  if(!confirm(id + "号機を強制終了します。使用中の場合はお客様画面へ終了指示を送り、最新データで送信します。")) return;
  const res = await fetch("/api/admin/machines/" + encodeURIComponent(id) + "/force-end", {method:"POST", headers:adminHeaders()});
  const data = await res.json();
  if(!data.ok){ alert(data.error || "強制終了に失敗しました"); return; }
  alert(data.queued ? id + "号機へ強制終了指示を送信しました。お客様画面が再読み込みされ、最新データで終了します。" : id + "号機を強制終了しました。空き台に戻しました");
  await new Promise(resolve => setTimeout(resolve, data.queued ? 1800 : 0));
  await Promise.all([loadMachines(), loadResults()]);
}
async function resetMachine(id){
  if(!confirm(`${id}号機をリセットします。スランプグラフと終了保持データも消えます。`)) return;
  const res = await fetch(`/api/admin/machines/${encodeURIComponent(id)}/reset`, {method:'POST', headers:adminHeaders()});
  const data = await res.json();
  if(!data.ok) alert(data.error || 'リセット失敗');
  await Promise.all([loadMachines(), loadResults()]);
}
async function verifyAdminPassword(password){
  const res = await fetch('/api/admin/passwords', {headers:password ? {'X-Admin-Password':password} : {}});
  return res.ok;
}
async function enterAdmin(password){
  const value = String(password || '').trim();
  if(!value){ $('authError').textContent = '管理パスを入力してください'; return; }
  $('authError').textContent = '';
  const ok = await verifyAdminPassword(value);
  if(!ok){ $('authError').textContent = '管理パスが違います'; return; }
  adminSecret = value;
  sessionStorage.setItem(ADMIN_STORAGE_KEY, value);
  document.body.classList.remove('locked');
  await refreshAll();
}
function logoutAdmin(){
  adminSecret = '';
  sessionStorage.removeItem(ADMIN_STORAGE_KEY);
  document.body.classList.add('locked');
  $('gatePassword').value = '';
  $('gatePassword').focus();
}
$('authForm').addEventListener('submit', e=>{ e.preventDefault(); enterAdmin($('gatePassword').value); });
$('logoutBtn').addEventListener('click', logoutAdmin);
$('issueBtn').addEventListener('click', issue);
window.addEventListener('resize', renderAdminSlumpGraphs);
async function refreshAll(){ if(!adminSecret) return; await Promise.all([loadMachines(), loadPasswords(), loadResults()]); }
setInterval(refreshAll, 60000);
if(adminSecret){ enterAdmin(adminSecret); } else { $('gatePassword').focus(); }
</script>
</body>
</html>
